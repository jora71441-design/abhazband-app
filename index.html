<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AbhazBand Camps</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #121212);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #aaaaaa);
      --button-color: var(--tg-theme-button-color, #3390ec);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 16px;
      text-align: center;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-content {
      padding: 14px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .card-badge {
      display: inline-block;
      background: var(--button-color);
      color: var(--button-text);
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .card-info {
      font-size: 13px;
      color: var(--hint-color);
      margin-bottom: 4px;
    }

    .card-price {
      font-size: 14px;
      font-weight: bold;
      color: #4cd964;
      margin: 8px 0;
    }

    .card-desc {
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .btn-book {
      width: 100%;
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">Календарь Кэмпов AbhazBand</div>
  <div id="camps-list" class="card-list"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const camps = [
      {
        id: "camp_sep_1_2026",
        title: "Гравийный / МТБ кэмп по Западной Абхазии",
        dates: "05 - 14 сентября (10 дней)",
        location: "Гагра / Балаганы / Охотничьи домики / Палатки",
        price: "85 000 ₽ (80 000 ₽ для членов AbhazBand)",
        specs: "Пробег: ~350 км | Набор: ~7 000 м",
        description: "Западная Абхазия, вершины гор, альпийские луга и горные озёра. Рекомендуется райдерам с подготовкой не ниже среднего уровня.",
        image: "./Sent_gravel_mtb-compressed.jpeg",
        link: "https://t.me/testAbhazBand2/2"
      },
      {
        id: "camp_sep_2_2026",
        title: "Комбинированный Шоссе vs Гравел",
        dates: "19 - 28 сентября (10 дней)",
        location: "База AbhazBand (Гагра / Сухум)",
        price: "85 000 ₽ (75 000 ₽ для членов AbhazBand)",
        specs: "Пробег: ~750 км | Набор: ~5 800 м",
        description: "Комбинированный шоссейно-гравийный кэмп по западным и восточным маршрутам.",
        image: "./Sent_shos_gravel-compressed.jpeg",
        link: "https://t.me/testAbhazBand2/3"
      },
      {
        id: "camp_oct_1_2026",
        title: "Комбинированный Шоссе vs Гравел",
        dates: "04 - 14 октября (11 дней)",
        location: "База AbhazBand (Гагра / Гал / Сухум)",
        price: "85 000 ₽ (75 000 ₽ для членов AbhazBand)",
        specs: "Пробег: ~800 км | Набор: ~7 000 м",
        description: "Комбинированный шоссейно-гравийный кэмп по западным и восточным маршрутам.",
        image: "./Okt_shos_gravel-compressed.jpeg",
        link: "https://t.me/testAbhazBand2/4"
      },
      {
        id: "camp_oct_2_2026",
        title: "Классический Шоссейный кэмп",
        dates: "24 октября - 03 ноября (11 дней)",
        location: "База AbhazBand (Гагра / Гал / Сухум)",
        price: "85 000 ₽ (75 000 ₽ для членов AbhazBand)",
        specs: "Пробег: ~800 км | Набор: ~7 000 м",
        description: "Классический шоссейный кэмп по западным и восточным маршрутам.",
        image: "./Okt_shosse-compressed.jpeg",
        link: "https://t.me/testAbhazBand2/5"
      },
      {
        id: "camp_nov_2026",
        title: "Клубные кэмпы",
        dates: "05 - 30 ноября",
        location: "Абхазия",
        price: "Уточняйте",
        specs: "",
        description: "Сезонные клубные заезды и тренировочные сборы.",
        image: "./Klubnie-compressed.jpeg",
        link: "https://t.me/testAbhazBand2/6"
      },
      {
        id: "camp_dec_2026",
        title: "Abhaz Band New Year",
        dates: "1 - 31 декабря",
        location: "Абхазия",
        price: "Уточняйте",
        specs: "",
        description: "Самостоятельные шоссейные приезды и локальные СошлРайды",
        image: "./Noviy_god-compressed.jpeg",
        link: "https://t.me/testAbhazBand2/7"
      }
    ];

    const container = document.getElementById('camps-list');

    camps.forEach(camp => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${camp.image}" alt="${camp.title}">
        <div class="card-content">
          <span class="card-badge">${camp.dates}</span>
          <div class="card-title">${camp.title}</div>
          <div class="card-info">📍 ${camp.location}</div>
          ${camp.specs ? `<div class="card-info">🚴 ${camp.specs}</div>` : ''}
          <div class="card-price">${camp.price}</div>
          <div class="card-desc">${camp.description}</div>
          <button class="btn-book" onclick="openLink('${camp.link}')">Подробнее и запись</button>
        </div>
      `;
      container.appendChild(card);
    });

    function openLink(url) {
      tg.openTelegramLink(url);
    }
  </script>
</body>
</html>
