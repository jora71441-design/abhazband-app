name: Abhaz Band Pages & Preview

on:
  push:
    branches:
      - main
      - 'preview/**'
  delete:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy-main-to-gh-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Publish main to gh-pages root and prune stale previews
        shell: bash
        run: |
          set -e
          rm -rf /tmp/gh_pages_work
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --branch gh-pages --single-branch "$REPO_URL" /tmp/gh_pages_work || {
            mkdir -p /tmp/gh_pages_work
            git -C /tmp/gh_pages_work init -b gh-pages
            git -C /tmp/gh_pages_work remote add origin "$REPO_URL"
          }

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='preview' \
            --exclude='preview/**' \
            repo/ /tmp/gh_pages_work/

          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess

          repo_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          out = subprocess.check_output(["git", "ls-remote", "--heads", repo_url, "refs/heads/preview/*"], text=True)
          active_slugs = set()
          for line in out.splitlines():
              parts = line.split("\t")
              if len(parts) == 2 and parts[1].startswith("refs/heads/preview/"):
                  name = parts[1][len("refs/heads/preview/"):]
                  slug = re.sub(r"[^A-Za-z0-9_-]+", "-", name).strip("-")
                  if slug:
                      active_slugs.add(slug)

          preview_dir = pathlib.Path("/tmp/gh_pages_work/preview")
          if preview_dir.exists():
              for child in preview_dir.iterdir():
                  if child.is_dir() and child.name not in active_slugs:
                      shutil.rmtree(child)
          PY

          git -C /tmp/gh_pages_work config user.name "Abhaz Band Bot"
          git -C /tmp/gh_pages_work config user.email "bot@abhazband.ru"
          git -C /tmp/gh_pages_work add -A
          if ! git -C /tmp/gh_pages_work diff --cached --quiet; then
            git -C /tmp/gh_pages_work commit -m "Deploy main to gh-pages"
            git -C /tmp/gh_pages_work push -u origin gh-pages
          fi

  build-and-deploy-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/preview/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Run syntax and data sanity checks
        shell: bash
        run: |
          set -e
          python3 -m py_compile repo/bot.py
          if command -v node >/dev/null 2>&1; then
            for f in repo/js/*.js; do
              [ -f "$f" ] && node --check "$f"
            done
          fi
          python3 - <<'PY'
          import pathlib
          data_path = pathlib.Path("repo/js/data.js")
          if data_path.exists():
              text = data_path.read_text(encoding="utf-8")
              for marker in ("camps", "rides"):
                  if marker not in text:
                      raise SystemExit(f"Missing '{marker}' in js/data.js")
          print("Checks passed.")
          PY

      - name: Publish preview to gh-pages/preview
        shell: bash
        run: |
          set -e
          BRANCH_NAME="${GITHUB_REF_NAME#preview/}"
          SAFE_SLUG="$(printf '%s' "$BRANCH_NAME" | tr -cs 'A-Za-z0-9_-' '-' | sed 's/^-*//; s/-*$//')"
          rm -rf /tmp/gh_pages_work
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --branch gh-pages --single-branch "$REPO_URL" /tmp/gh_pages_work || {
            mkdir -p /tmp/gh_pages_work
            git -C /tmp/gh_pages_work init -b gh-pages
            git -C /tmp/gh_pages_work remote add origin "$REPO_URL"
          }

          rm -rf "/tmp/gh_pages_work/preview/$SAFE_SLUG"
          mkdir -p "/tmp/gh_pages_work/preview/$SAFE_SLUG"
          rsync -a --exclude='.git' --exclude='.github' repo/ "/tmp/gh_pages_work/preview/$SAFE_SLUG/"

          git -C /tmp/gh_pages_work config user.name "Abhaz Band Bot"
          git -C /tmp/gh_pages_work config user.email "bot@abhazband.ru"
          git -C /tmp/gh_pages_work add -A
          if ! git -C /tmp/gh_pages_work diff --cached --quiet; then
            git -C /tmp/gh_pages_work commit -m "Preview build: preview/${BRANCH_NAME}"
            git -C /tmp/gh_pages_work push -u origin gh-pages
          fi

  cleanup-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/')
    runs-on: ubuntu-latest
    env:
      DELETED_REF: ${{ github.event.ref }}
    steps:
      - name: Remove deleted preview folder from gh-pages
        shell: bash
        run: |
          set -e
          rm -rf /tmp/gh_pages_work
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --branch gh-pages --single-branch "$REPO_URL" /tmp/gh_pages_work || exit 0

          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess

          repo_url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          out = subprocess.check_output(["git", "ls-remote", "--heads", repo_url, "refs/heads/preview/*"], text=True)
          active_slugs = set()
          for line in out.splitlines():
              parts = line.split("\t")
              if len(parts) == 2 and parts[1].startswith("refs/heads/preview/"):
                  name = parts[1][len("refs/heads/preview/"):]
                  slug = re.sub(r"[^A-Za-z0-9_-]+", "-", name).strip("-")
                  if slug:
                      active_slugs.add(slug)

          preview_dir = pathlib.Path("/tmp/gh_pages_work/preview")
          if preview_dir.exists():
              for child in preview_dir.iterdir():
                  if child.is_dir() and child.name not in active_slugs:
                      shutil.rmtree(child)
          PY

          git -C /tmp/gh_pages_work config user.name "Abhaz Band Bot"
          git -C /tmp/gh_pages_work config user.email "bot@abhazband.ru"
          git -C /tmp/gh_pages_work add -A
          if ! git -C /tmp/gh_pages_work diff --cached --quiet; then
            git -C /tmp/gh_pages_work commit -m "Cleanup preview: ${DELETED_REF}"
            git -C /tmp/gh_pages_work push origin gh-pages
          fi
